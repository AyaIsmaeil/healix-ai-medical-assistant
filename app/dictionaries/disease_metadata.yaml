# Healix — قاموس البيانات الوصفية للأمراض (Disease Metadata)
#
# مصدر حقيقة واحد لكل ما هو معروف عن أمراض DDXPlus الـ٤٩: رمز ICD-10،
# الشدّة كما وثّقها DDXPlus، والتخصّص الطبي المقترح. التدفّق المعماري:
#
#     Disease (اسم من XGBoost) -> disease_metadata (هذا الملف) -> Specialty
#
# لا حساب ICD->تخصّص حيّ داخل منطق التطبيق — كل الاستدلال مُجرى هنا مرّة
# واحدة، مُراجَعاً، وموثَّق المصدر لكل حقل.
#
# ============================ المصادر ============================
# icd10 / severity: مُستخرَجة حرفياً من app/data/raw/ddxplus/release_conditions.json
#   (DDXPlus — Fansi Tchango et al., "DDXPlus: A New Dataset For Automatic
#   Medical Diagnosis", NeurIPS 2022 Datasets & Benchmarks, arXiv:2205.09148).
#
# severity: "ranging from 1 to 5 with the lowest values describing the most
#   severe pathologies" (الورقة، قسم 3.1/3.4) — من قاعدة معرفة طبية مملوكة
#   (proprietary KB) بُنيت من >20,000 ورقة طبية و"رُوجعت من أطباء متعدّدين"
#   (Appendix A). ⚠️ ليست مقياس severity سريرياً منشوراً/مُصادَقاً عليه
#   (لا منهجية تسجيل ولا inter-rater reliability مذكورة بالورقة) — تُستخدَم
#   هنا كحقل توثيقي/إشارة مساعدة فقط، لا كأساس لأي منطق سريري مباشر.
#
# icd10_block / icd10_block_name_who: تصنيف WHO الرسمي الفرعي (بلوك) داخل
#   فصل ICD-10 — رسمي، لا اجتهاد.
#
# specialty: اصطلاح سريري شائع يربط بلوك/فصل ICD-10 بتخصّص طبي — **ليس
#   معيار WHO رسمياً بذاته** (WHO يعرّف تصنيف الأمراض لا توزيع التخصّصات).
#   عند تطابق البلوك مع الممارسة السريرية المعروفة → specialty نظيف
#   (requires_review: false). عند تعارض حقيقي (مثال: بلوك الجهاز التنفّسي
#   J00-J06 يضمّ حالات أنف/أذن/حنجرة لا تخصّ Pulmonology فعلياً) → specialty
#   = "General Medicine" صراحة، مع review_reason موثَّق، لا قيمة null أبداً
#   ولا تخمين طبي مني.
#
# ============================ إحصاء ============================
# ٤٩ مرضاً، صفر specialty فارغ.

