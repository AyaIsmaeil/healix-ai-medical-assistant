# Healix — قاموس ربط الأعراض العربية برموز أدلة DDXPlus (Symptom → Evidence)
#
# هذا الملف بيانات خالصة، لا منطق. يُحمَّل مرّة واحدة عند الإقلاع عبر
# DictionaryLoader (نفس نمط red_flags.yaml وclinical_priority.yaml).
#
# الهدف: سدّ فجوة معماريّة موثَّقة بـ``domain.ml_disease_predictor`` — مخطّط
# الترميز النشط (v1.json) لا يُصدِّر أي عمود ``E_*``، فالنموذج المدرَّب
# (XGBoost على 225 عمود DDXPlus) كان يستقبل دائماً متجهاً فارغاً من الأدلة.
# هذا القاموس يربط أسماء الأعراض العربية الشائعة يلي تستخرجها المقابلة
# برموز الأدلة المقابلة من ``app/data/raw/ddxplus/release_evidences.json``
# (المصدر الرسمي — ``evidence_source`` بكل مدخلة نص السؤال الإنجليزي الحقيقي).
#
# ============================ قيود معلنة ============================
# ١. تغطية جزئية عمداً: الأعراض العشرة الشائعة يلي تستخرجها المقابلة فعلياً
#    (انظر ``app/llm/mock_provider.py::_SYMPTOM_LEXICON`` كمرجع)، لا الـ٢٢٣
#    رمز دليل كاملة. توسيع لاحق إضافة محضة.
# ٢. **قيد جوهري بنموذج DDXPلus نفسه**: الألم (صداع/ألم صدر/ألم بطن) ليس له
#    رمز دليل مخصّص بـDDXPlus — يُنمذَج دائماً عبر السؤال العام "هل تشعر بألم
#    بمكان ما؟" (E_53) + موقع الألم كقيمة فرعية ضمن (E_55، سؤال متعدّد القيم).
#    عمودنا المُدرَّب (من الدفتر 03) يلتقط **وجود رمز الدليل فقط**، لا القيمة
#    الفرعية (الموقع) — فصداع وألم صدر وألم بطن تُنتج **نفس رمزَي الدليل**
#    حالياً (E_53 + E_55)، بلا تمييز الموقع. هذا ليس خطأً بالربط، بل انعكاس
#    أمين لحدود مخطّط الترميز الحالي — توثَّق هنا صراحةً بدل التظاهر بدقّة
#    غير موجودة. تمييز الموقع يتطلّب طبقة ترميز مستقبلية (v2.json، ~286 عمود،
#    مذكورة بالتوثيق المعماري السابق) خارج نطاق هذا الربط المصغَّر.
# ٣. المطابقة نصّية (بعد normalize_arabic) لا دلالية — نفس أسلوب red_flags.yaml.
#
# ============================ اصطلاح ============================
# كل مدخلة: أسماء عربية (تُطابَق كسلاسل فرعية بعد التطبيع) + قائمة رموز
# الأدلة (E_*) التي تُفعَّل (=1) عند مطابقة أي اسم، + evidence_source (نص
# السؤال الإنجليزي الحقيقي من release_evidences.json، دليل قابل للتحقّق).

version: "1.0.0"

mappings:

  - concept: "fever"
    names: ["حرارة", "حرار", "حمى", "حمّى", "سخونة", "سخون"]
    evidence_codes: ["E_91"]
    evidence_source: "E_91: Do you have a fever (either felt or measured with a thermometer)?"

  - concept: "cough"
    names: ["سعال", "كحة"]
    evidence_codes: ["E_201"]
    evidence_source: "E_201: Do you have a cough?"

  - concept: "dyspnea"
    names: ["ضيق تنفس", "ضيق نفس", "صعوبة تنفس", "صعوبة بالتنفس"]
    evidence_codes: ["E_66"]
    evidence_source: "E_66: Are you experiencing shortness of breath or difficulty breathing in a significant way?"

  - concept: "nausea"
    names: ["غثيان", "استفراغ", "تقيؤ", "تقيّؤ"]
    evidence_codes: ["E_148"]
    evidence_source: "E_148: Are you feeling nauseous or do you feel like vomiting?"

  - concept: "diarrhea"
    names: ["إسهال", "اسهال"]
    evidence_codes: ["E_51"]
    evidence_source: "E_51: Have you had diarrhea or an increase in stool frequency?"

  - concept: "dizziness"
    names: ["دوخة", "دوار"]
    evidence_codes: ["E_82"]
    evidence_source: "E_82: Do you feel lightheaded and dizzy or do you feel like you are about to faint?"

  - concept: "sore_throat"
    names: ["ألم حلق", "وجع حلق", "حلق", "بلعوم"]
    evidence_codes: ["E_97"]
    evidence_source: "E_97: Do you have a sore throat?"

  # ---------- الألم: نفس رمزَي الدليل للثلاثة (انظر القيد رقم ٢ أعلاه) ----------

  - concept: "headache"
    names: ["صداع", "ألم رأس", "وجع رأس"]
    evidence_codes: ["E_53", "E_55"]
    evidence_source: "E_53: Do you have pain somewhere, related to your reason for consulting? / E_55: Do you feel pain somewhere? (location values include forehead/temple/back of head)"

  - concept: "chest_pain"
    names: ["ألم صدر", "وجع صدر", "ذبحة"]
    evidence_codes: ["E_53", "E_55"]
    evidence_source: "E_53/E_55 — same generic pain-location question; DDXPlus has no dedicated chest-pain evidence code."

  - concept: "abdominal_pain"
    names: ["ألم بطن", "معدة", "مغص"]
    evidence_codes: ["E_53", "E_55"]
    evidence_source: "E_53/E_55 — same generic pain-location question; DDXPlus has no dedicated abdominal-pain evidence code."

  # ---------- توسيع: أعراض ثنائية شائعة، كل منها 1:1 مع رمز دليل واحد ----------
  # كل مدخلة أدناه: رمز واحد (data_type=B، غير سابقة) موجود بنموذجنا المدرَّب،
  # وevidence_source هو نصّ السؤال الإنجليزي الرسمي من release_evidences.json —
  # مصدر قابل للتحقّق، لا ترجمة اجتهادية. (تحقّق: كلها present بـ feature_names.json)

  - concept: "palpitations"
    names: ["خفقان", "خفقان قلب", "قلبي بيدق بسرعة", "ضربات قلب سريعة"]
    evidence_codes: ["E_155"]
    evidence_source: "E_155: Do you feel your heart is beating fast (racing), irregularly (missing a beat) or do you feel palpitations?"

  - concept: "chills"
    names: ["قشعريرة", "رعشة", "برد وارتجاف"]
    evidence_codes: ["E_94"]
    evidence_source: "E_94: Have you had chills or shivers?"

  - concept: "runny_nose"
    names: ["رشح", "زكام", "احتقان أنف", "سيلان أنف"]
    evidence_codes: ["E_181"]
    evidence_source: "E_181: Do you have nasal congestion or a clear runny nose?"

  - concept: "fatigue"
    names: ["تعب", "إرهاق", "إعياء", "خمول"]
    evidence_codes: ["E_89"]
    evidence_source: "E_89: Do you constantly feel fatigued or do you have non-restful sleep?"

  - concept: "loss_of_appetite"
    names: ["فقدان شهية", "ما في نفس للأكل", "قلة شهية"]
    evidence_codes: ["E_32"]
    evidence_source: "E_32: Do you have a decrease in appetite?"

  - concept: "difficulty_swallowing"
    names: ["صعوبة بلع", "صعوبة بالبلع", "ما بقدر ابلع"]
    evidence_codes: ["E_65"]
    evidence_source: "E_65: Do you have difficulty swallowing, or have a feeling of discomfort/blockage when swallowing?"

  - concept: "difficulty_speaking"
    names: ["صعوبة نطق", "صعوبة بالكلام", "تلعثم", "ما بقدر احكي"]
    evidence_codes: ["E_63"]
    evidence_source: "E_63: Do you have difficulty articulating words/speaking?"

  - concept: "coughing_blood"
    names: ["نفث دم", "سعال مدمى", "بصق دم مع السعال"]
    evidence_codes: ["E_45"]
    evidence_source: "E_45: Have you been coughing up blood?"

  - concept: "excessive_sweating"
    names: ["تعرق زائد", "تعرق شديد", "عرق كتير"]
    evidence_codes: ["E_50"]
    evidence_source: "E_50: Have you had significantly increased sweating?"

  - concept: "swollen_lymph_nodes"
    names: ["غدد منتفخة", "تورم الغدد", "غدد ليمفاوية"]
    evidence_codes: ["E_9"]
    evidence_source: "E_9: Do you have swollen or painful lymph nodes?"

  - concept: "skin_rash"
    names: ["طفح جلدي", "احمرار جلد", "بقع بالجلد", "حبوب بالجلد"]
    evidence_codes: ["E_129"]
    evidence_source: "E_129: Do you have any lesions, redness or problems on your skin that you believe are related to the condition you are consulting for?"

  - concept: "abdominal_bloating"
    names: ["انتفاخ بطن", "بطني منفوخة", "غازات"]
    evidence_codes: ["E_30"]
    evidence_source: "E_30: Do you feel your abdomen is bloated or distended (swollen due to pressure from inside)?"

  - concept: "mouth_ulcers"
    names: ["تقرحات فم", "قرح بالفم", "فقاعات بالفم"]
    evidence_codes: ["E_206"]
    evidence_source: "E_206: Do you have painful mouth ulcers or sores?"

  - concept: "itchy_eyes"
    names: ["حكة عين", "حكة بالعيون", "عيوني بتحكّ"]
    evidence_codes: ["E_170"]
    evidence_source: "E_170: Do you have severe itching in one or both eyes?"

  - concept: "loss_of_consciousness"
    names: ["فقدان وعي", "إغماء", "غبت عن الوعي"]
    evidence_codes: ["E_159"]
    evidence_source: "E_159: Did you lose consciousness?"

  - concept: "muscle_pain"
    names: ["ألم عضلات", "وجع عضلات", "ألم بالجسم"]
    evidence_codes: ["E_144"]
    evidence_source: "E_144: Do you have diffuse (widespread) muscle pain?"

  - concept: "vomiting_blood"
    names: ["تقيؤ دم", "استفراغ دم", "رجعت دم"]
    evidence_codes: ["E_210"]
    evidence_source: "E_210: Have you recently thrown up blood or something resembling coffee beans?"

  - concept: "blood_in_stool"
    names: ["دم بالبراز", "نزيف مع البراز", "دم مع التبرز"]
    evidence_codes: ["E_179"]
    evidence_source: "E_179: Have you noticed light red blood or blood clots in your stool?"

  - concept: "wheezing"
    names: ["أزيز", "صفير بالصدر", "صفير عند التنفس"]
    evidence_codes: ["E_214"]
    evidence_source: "E_214: Have you noticed a wheezing sound when you exhale?"

  - concept: "nasal_itch"
    names: ["حكة أنف", "حكة بالحلق", "أنفي بيحكّ"]
    evidence_codes: ["E_169"]
    evidence_source: "E_169: Is your nose or the back of your throat itchy?"
