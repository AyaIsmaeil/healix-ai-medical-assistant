    # Healix — جدول الأولوية السريرية (P1)
#
# بيانات خالصة، لا منطق. يُحمَّل مرّة واحدة عند الإقلاع عبر DictionaryLoader
# (نفس نمط red_flags.yaml و specialty_lookup.yaml).
#
# الغرض: تحديد **الشكوى الرئيسية الحالية** حتمياً بعد كل رسالة، بدل الاعتماد
# على ترتيب الظهور. مريض يذكر الصداع أولاً ثم ألم صدر ضاغط يجب أن تتحوّل
# المقابلة فوراً إلى ألم الصدر.
#
# ============================ حدّ المجال ============================
# هذا الجدول **لا يُشخّص**. ``acuity`` تعبّر عن "كم يستحق هذا العرَض أن
# يتصدّر أسئلة التاريخ المرضي"، لا عن احتمال مرض ولا عن خطورته النهائية.
#
# ============================ قيود معلنة ============================
# ١. التغطية محدودة بالأعراض الشائعة؛ عرَض غير مُدرَج يأخذ default_acuity.
# ٢. المطابقة نصّية بعد التطبيع — ترثُ هشاشة ترتيب الكلمات نفسها الموثّقة
#    في محرّك الأعلام الحمراء.
# ٣. بعض المصطلحات تتكرّر مع red_flags.yaml عن قصد: الملفّان لهما غرضان
#    ودورتا مراجعة مختلفتان، وربطهما ببعض أسوأ من تكرار بضع سلاسل.
#
# ============================ الأوزان ============================
# acuity 0..100 — الأهمية السريرية الأساسية.
#   90+ : يستوجب تقييماً عاجلاً بطبيعته (صدر، تنفّس، عصبي حادّ)
#   70-89: مقلق ويستحق التصدّر على الشائع
#   40-69: شائع لكنه ذو قيمة تشخيصية
#   <40  : خفيف/غير نوعي

version: "1.0.0"

# عرَض غير مُدرَج: لا يُهمَل ولا يتصدّر — يبقى قابلاً للسؤال عنه.
default_acuity: 30

# مكثِّفات الشدّة في كلام المريض (تُطابَق على كامل الرسائل).
severity_terms:
  high:
    - "شديد جدا"
    - "شديد جداً"
    - "لا يحتمل"
    - "ما بحتمل"
    - "ما بطيق"
    - "فظيع"
    - "اسوا"
    - "قاتل"
    - "unbearable"
    - "severe"
  moderate:
    - "شديد"
    - "قوي"
    - "كتير"
    - "مزعج"
    - "moderate"

# دلائل تأكيد المريض (تكرار الشكوى أو إلحاح لفظي).
emphasis_terms:
  - "بجد"
  - "والله"
  - "خايف"
  - "قلقان"
  - "مش طبيعي"
  - "اول مرة"
  - "أول مرة"
  - "صار اسوا"
  - "عم يزيد"

concepts:

  # ---------- قلبية / صدرية: أعلى أولوية ----------
  chest_pain:
    name_ar: "ألم الصدر"
    name_en: "Chest pain"
    acuity: 95
    terms:
      - "الم صدر"
      - "الم بصدري"
      - "الم بالصدر"
      - "الم في صدري"
      - "وجع صدر"
      - "وجع بصدري"
      - "وجع بالصدر"
      - "ضاغط بصدري"
      - "ضغط بصدري"
      - "ثقل بصدري"
      - "ذبحة"
      - "chest pain"
    # احتياط أمتن من العبارات: يكفي حضور رمز ألم + رمز صدر بأي ترتيب.
    # أضيف بعد أن أثبت اختبار حيّ سقوط "ألم ضاغط في الصدر" إلى الدرجة
    # الافتراضية، فهبط تحت الصداع — خطأ ترتيب ذو أثر سريري مباشر.
    all_tokens:
      - ["الم", "وجع", "ضاغط", "ضغط", "ثقل", "حرقه", "عاصر"]
      - ["صدر", "قفص"]

  dyspnea:
