    # Healix — كتالوج الأعلام الحمراء (الشريحة الأولى: ١٠ قواعد)
#
# هذا الملف بيانات خالصة، لا منطق. يُحمَّل مرّة واحدة عند الإقلاع عبر
# DictionaryLoader (نفس نمط feature_validation_rules.json و specialty_lookup.yaml).
#
# ما هذا الملف: مجموعة قواعد **دنيا** لكشف أنماط تستوجب رعاية عاجلة.
# ما ليس هذا الملف: قاعدة معرفة طبية، ولا أداة تشخيص، ولا فرز معتمد.
#
# ============================ قيود معلنة ============================
# ١. المجموعة محدودة (١٠ قواعد) — السلبيات الكاذبة ممكنة وواردة.
# ٢. تغطية اللهجات العربية ناقصة عمداً بهذه الشريحة (شامي/فصحى بالأساس،
#    مع بعض الخليجي والمصري). التوسّع إضافة محضة لاحقاً.
# ٣. قواعد السياق الديموغرافي (نزيف الحمل، حمى الرضيع) تُقيَّم لفظياً من نصّ
#    المريض لأن ClinicalRecord لا يحمل حقول عمر/جنس/حمل منظَّمة بعد.
# ٤. المطابقة نصّية (بعد تطبيع) لا دلالية — التعبير غير المباشر يُترك
#    للطبقة المدعومة بالـLLM التي ترفع الخطورة ولا تخفضها.
#
# ============================ اصطلاح ============================
# term_groups: مجموعات مترادفات قابلة لإعادة الاستخدام عبر القواعد.
#   المصطلحات تُطابَق كسلاسل فرعية بعد التطبيع، لذا تُفضَّل العبارات الطويلة
#   على الكلمات القصيرة تفادياً للمطابقات الكاذبة (مثلاً "دم" وحدها ممنوعة).
# rules: تُطلق عندما تتحقّق كل all_of ومجموعة واحدة على الأقل من any_of.

version: "1.0.0"

term_groups:

  # ---------- الصدر والدورة الدموية ----------
  # ملاحظة تغطية: المطابقة سلسلة فرعية، فتلزم صياغات حروف الجرّ والضمائر
  # صراحةً ("بصدري" / "بالصدر" / "في صدري"). كشفت الاختبارات أن إسقاط
  # "الم بصدري" كان يُفوّت نمط ACS كاملاً — التوسّع هنا إضافة محضة.
  chest_pain:
    - "الم صدر"
    - "الم بصدري"
    - "الم بالصدر"
    - "الم في صدري"
    - "الم في الصدر"
    - "الم بمنطقة الصدر"
    - "وجع صدر"
    - "وجع بصدري"
    - "وجع بالصدر"
    - "وجع في صدري"
    - "صدري بيوجعني"
    - "صدري يوجعني"
    - "ضغط على صدري"
    - "ضغط بصدري"
    - "ضغطة بصدري"
    - "حرقة بصدري"
    # وصف "ضاغط/عاصر/ثقل" وصف كلاسيكي لألم إقفاري. صياغة «ألم ضاغط بصدري»
    # تفصل فيها كلمةٌ بين "ألم" و"بصدري" فتُفشل المصطلحات أعلاه — وقد أثبت
    # اختبار حيّ أنّ L0 كان يُفوّت نمط ACS كاملاً بسببها.
    - "ضاغط بصدري"
    - "ضاغط بالصدر"
    - "ضاغط على صدري"
    - "ضاغط في صدري"
    # "ضاغط قوي بالصدر" — صفة الشدّة ("قوي") تفصل بدورها بين "ضاغط" و"بالصدر"،
    # نفس نمط فجوة "ألم ضاغط بصدري" أعلاه. كشفها اختبار حيّ أثناء تجربة API فعلية.
    - "ضاغط قوي بصدري"
    - "ضاغط قوي بالصدر"
    - "عاصر بصدري"
    - "ثقل بصدري"
    - "ثقل على صدري"
    - "chest pain"
    - "chest pressure"
    - "pain in my chest"

  radiation_arm_jaw:
    - "ينتشر لذراعي"
    - "ينزل بايدي"
    - "نازل على ايدي"
    - "يمتد الى ذراعي"
    - "يمتد لذراعي"
    - "الم بفكي"
    - "ينتشر للفك"
    - "ينتشر للظهر"
    - "radiating to arm"

  diaphoresis:
    - "عرق بارد"
    - "تعرق بارد"
    - "تعرق شديد"
    - "عم اتعرق كتير"
    - "cold sweat"

  # ---------- التنفّس ----------
  dyspnea:
    - "ضيق تنفس"
    - "ضيق نفس"
    - "ضيق بالتنفس"
    - "صعوبة تنفس"
    - "صعوبة بالتنفس"
    - "ما بقدر اتنفس"
    - "مش قادر اتنفس"
    - "ما اقدر اتنفس"
    - "نفسي مقطوع"
    - "shortness of breath"
    - "difficulty breathing"

  cannot_complete_sentence:
    - "ما بقدر اكمل جملة"
    - "ما بقدر احكي"
    - "مش قادر اكمل كلامي"
    - "بتقطع نفسي وانا بحكي"
    - "cannot complete a sentence"

  cyanosis:
    - "شفايفي زرقت"
    - "لون شفايفه ازرق"
    - "ازرقاق"
    - "turning blue"

  # ---------- العصبي ----------
  facial_droop:
    - "وجهي مايل"
    - "فمي مايل"
    - "نص وجهي"
    - "تدلي الوجه"
    - "face drooping"

  unilateral_weakness:
    - "ضعف بنص جسمي"
    - "شلل بنص جسمي"
    - "ما بحس بايدي"
    - "ما بقدر احرك ايدي"
    - "ما بقدر احرك رجلي"
    # صيغ الضمير المتّصل: "إيدي اليمين ما بقدر أحرّكها" — ترتيب كلمات مختلف
    # يُفوّته المصطلح أعلاه. لم نستخدم "ما بقدر احرك" وحدها تفادياً لإطلاق
    # كاذب على أطراف غير عصبية ("ما بقدر احرك رقبتي").
    - "ما بقدر احركها"
    - "ما بقدر احركه"
    - "ما اقدر احركها"
    - "ما اقدر احركه"
    - "خدر بنص جسمي"
    - "one side weakness"

  speech_difficulty:
    - "ما بقدر احكي منيح"
    - "كلامي متلعثم"
    - "لساني ثقيل"
    - "صعوبة بالكلام"
    - "فقدت النطق"
    - "slurred speech"

  loss_of_consciousness:
    - "فقدت الوعي"
    - "غبت عن الوعي"
    - "اغمي علي"
    - "طاح مغشي عليه"
    - "فقد الوعي"
    - "loss of consciousness"
    - "fainted"

  # ---------- الصداع ----------
  headache:
    - "صداع"
    - "وجع راس"
    - "وجع براسي"
    - "راسي عم يوجعني"
    - "الم بالراس"
    - "headache"

  thunderclap_quality:
    - "اسوا صداع بحياتي"
    - "اشد صداع بحياتي"
    - "صداع مفاجئ وشديد"
    # بلا كلمة "اجاني" في البداية: المريض قد يقول "اجاني صداع فجأة وقوي"
    # فتتوسّط كلمةٌ المصطلحَ وتُفشل المطابقة بالسلسلة الفرعية.
    - "فجاة وقوي"
    - "فجاة وشديد"
    - "مفاجئ وقوي"
    - "worst headache of my life"

  # ---------- الحساسية ----------
  swelling_face_throat:
    - "تورم بوجهي"
    - "تورم بشفايفي"
    - "لساني منتفخ"
    - "حلقي منتفخ"
    - "انتفاخ بالوجه"
    - "swelling of the face"
    - "throat swelling"

  rash_urticaria:
    - "طفح جلدي"
    - "حبوب حمرا"
    - "شرى"
    - "بقع حمرا بجسمي"
    - "hives"
    - "rash"

  # ---------- النزيف ----------
  bleeding:
    - "نزيف"
    - "بنزف"
    - "عم ينزف"
    - "ينزف بغزارة"
    - "bleeding"

  bleeding_severe_qualifier:
    - "نزيف شديد"
    - "نزيف غزير"
    - "دم كتير"
    - "ما بوقف النزيف"
    - "heavy bleeding"

  # ---------- الحمل ----------
  pregnancy_context:
    - "حامل"
    - "انا حامل"
    - "بالشهر التاسع"
    - "بالشهر السابع"
    - "حملي"
    - "pregnant"

  # ملاحظة: لا توجد مجموعة "ألم بطن" هنا عمداً — انظر ملاحظة القاعدة 0006.

  # ---------- الرضّع ----------
  infant_context:
    - "رضيع"
    - "ابني عمره شهر"
    - "ابني عمره شهرين"
    - "بنتي عمرها شهر"
    - "بنتي عمرها شهرين"
    - "عمره اسبوعين"
    - "عمره ٤٠ يوم"
    - "newborn"
    - "infant"

  fever:
    - "حرارة"
    - "حراره"
    - "سخونة"
    - "سخونه"
    - "حمى"
    - "fever"

  # ---------- الصحة النفسية ----------
  suicidal_ideation:
    - "بدي اموت"
    - "بفكر اقتل حالي"
    - "بدي انهي حياتي"
    - "ما بدي اعيش"
    - "بفكر بالانتحار"
    - "راح اذي حالي"
    - "بدي اذي نفسي"
    - "suicidal"
    - "kill myself"
    - "end my life"

rules:

  - rule_id: "HEALIX_REDFLAG_0001"
    name_ar: "نمط متلازمة الشريان التاجي الحادة"
    name_en: "Acute Coronary Syndrome pattern"
    risk_level: "immediate"
    trigger_type: "combination"
    all_of: ["chest_pain"]
    any_of: ["dyspnea", "diaphoresis", "radiation_arm_jaw"]
    recommended_action_ar: "هذه الأعراض قد تكون علامة على حالة قلبية طارئة. توجّه إلى أقرب قسم طوارئ فوراً أو اطلب الإسعاف الآن. لا تقُد بنفسك."
    recommended_action_en: "These symptoms may indicate a cardiac emergency. Seek emergency care immediately or call an ambulance. Do not drive yourself."
    evidence_source: "نمط سريري راسخ لألم الصدر المصاحب للأعراض الإنذارية"
    notes: "ألم الصدر وحده لا يُطلق القاعدة — التركيب مطلوب لتقليل الإيجابيات الكاذبة."

  - rule_id: "HEALIX_REDFLAG_0002"
    name_ar: "علامات سكتة دماغية محتملة (FAST)"
    name_en: "Possible stroke (FAST)"
    risk_level: "immediate"
    trigger_type: "combination"
    all_of: []
    any_of: ["facial_droop", "unilateral_weakness", "speech_difficulty"]
    recommended_action_ar: "هذه العلامات قد تدل على سكتة دماغية. اطلب الإسعاف فوراً — الوقت عامل حاسم في هذه الحالة."
    recommended_action_en: "These signs may indicate a stroke. Call emergency services immediately — time is critical."
    evidence_source: "معايير FAST المعتمدة في التوعية بالسكتة الدماغية"
    notes: "أي علامة FAST منفردة كافية للتصعيد — عتبة منخفضة عمداً لحساسية الوقت."

  - rule_id: "HEALIX_REDFLAG_0003"
    name_ar: "فقدان الوعي"
    name_en: "Loss of consciousness"
    risk_level: "immediate"
    trigger_type: "single_term"
    all_of: ["loss_of_consciousness"]
    any_of: []
    recommended_action_ar: "فقدان الوعي يستوجب تقييماً طبياً عاجلاً. توجّه إلى الطوارئ أو اطلب الإسعاف فوراً."
    recommended_action_en: "Loss of consciousness requires urgent medical evaluation. Seek emergency care immediately."
    evidence_source: "فقدان الوعي عرَض إنذاري قائم بذاته"
    notes: "لا يحتاج تركيباً — كافٍ بذاته."

  - rule_id: "HEALIX_REDFLAG_0004"
    name_ar: "تفاعل تحسّسي شديد محتمل (تأق)"
    name_en: "Possible anaphylaxis"
    risk_level: "immediate"
    trigger_type: "combination"
    all_of: ["swelling_face_throat"]
    any_of: ["dyspnea", "rash_urticaria", "cyanosis"]
    recommended_action_ar: "قد يكون هذا تفاعلاً تحسّسياً شديداً. اطلب الإسعاف فوراً. إن كان لديك حاقن أدرينالين موصوف لك سابقاً فاستخدمه حسب تعليمات طبيبك."
    recommended_action_en: "This may be a severe allergic reaction. Call emergency services immediately. If you have a previously prescribed epinephrine auto-injector, use it as instructed by your doctor."
    evidence_source: "نمط التأق: تورّم الوجه/الحلق مع أعراض تنفسية أو جلدية"
    notes: "لا يُذكر أي دواء أو جرعة جديدة — الإشارة فقط لما وُصف للمريض سابقاً."

  - rule_id: "HEALIX_REDFLAG_0005"
    name_ar: "نزيف شديد"
    name_en: "Severe bleeding"
    risk_level: "immediate"
    trigger_type: "combination"
    all_of: ["bleeding"]
    any_of: ["bleeding_severe_qualifier"]
    recommended_action_ar: "النزيف الشديد حالة طارئة. اطلب الإسعاف فوراً واضغط على مكان النزيف بقطعة قماش نظيفة إن أمكن."
    recommended_action_en: "Severe bleeding is an emergency. Call emergency services immediately and apply pressure to the site with a clean cloth if possible."
    evidence_source: "النزيف غير المسيطر عليه حالة إسعافية"
    notes: "يتطلب مُحدِّد شدّة — 'نزيف' وحدها قد تصف حالة بسيطة."

  - rule_id: "HEALIX_REDFLAG_0006"
    name_ar: "نزيف أثناء الحمل"
    name_en: "Bleeding during pregnancy"
    risk_level: "immediate"
    trigger_type: "demographic_context"
    all_of: ["pregnancy_context", "bleeding"]
    any_of: []
    recommended_action_ar: "النزيف أثناء الحمل يستوجب تقييماً طبياً عاجلاً. توجّهي إلى الطوارئ أو قسم النساء والولادة فوراً."
    recommended_action_en: "Bleeding during pregnancy requires urgent evaluation. Go to the emergency department or obstetric unit immediately."
    evidence_source: "النزيف في أي مرحلة من الحمل علامة إنذارية"
    notes: >-
      ألم البطن **غير مشترط** عمداً: النزيف غير المؤلم أثناء الحمل (كالمشيمة
      المنزاحة) حالة طارئة حقيقية، واشتراط الألم كان سيُنتج سلبية كاذبة خطيرة.
      قيد: سياق الحمل يُكتشف لفظياً — لا حقل حمل منظَّم في السجل بعد.

  - rule_id: "HEALIX_REDFLAG_0007"
    name_ar: "صداع رعدي (بدء مفاجئ شديد)"
    name_en: "Thunderclap headache"
    risk_level: "immediate"
    trigger_type: "combination"
    all_of: ["headache", "thunderclap_quality"]
    any_of: []
    recommended_action_ar: "الصداع المفاجئ الشديد جداً يستوجب تقييماً طبياً عاجلاً. توجّه إلى الطوارئ فوراً."
    recommended_action_en: "A sudden, extremely severe headache requires urgent evaluation. Go to the emergency department immediately."
    evidence_source: "الصداع الرعدي علامة إنذارية معروفة تستوجب استبعاد أسباب خطيرة"
    notes: "يتطلب وصف 'الأسوأ/المفاجئ' — الصداع وحده شائع وغير إنذاري."

  - rule_id: "HEALIX_REDFLAG_0008"
    name_ar: "حمى لدى رضيع دون ثلاثة أشهر"
    name_en: "Fever in an infant under three months"
    risk_level: "urgent"
    trigger_type: "demographic_context"
    all_of: ["infant_context", "fever"]
    any_of: []
    recommended_action_ar: "الحمى عند الرضيع في هذا العمر تستوجب تقييماً طبياً عاجلاً مهما بدت بسيطة. توجّه إلى الطوارئ أو طبيب الأطفال فوراً."
    recommended_action_en: "Fever in an infant this young requires urgent medical evaluation regardless of how mild it seems. Seek emergency or pediatric care immediately."
    evidence_source: "الحمى في الرضّع دون ٣ أشهر تستوجب تقييماً عاجلاً"
    notes: "قيد: العمر يُكتشف لفظياً — لا حقل عمر منظَّم في السجل بعد."

  - rule_id: "HEALIX_REDFLAG_0009"
    name_ar: "أفكار انتحارية أو إيذاء النفس"
    name_en: "Suicidal ideation or self-harm"
    risk_level: "immediate"
    trigger_type: "single_term"
    all_of: ["suicidal_ideation"]
    any_of: []
    recommended_action_ar: "ما تشعر به مهم، وأنت لست وحدك. تواصل فوراً مع خط الدعم النفسي في بلدك أو توجّه إلى أقرب قسم طوارئ. إن كنت في خطر مباشر فاطلب الإسعاف الآن، وابقَ بصحبة شخص تثق به."
    recommended_action_en: "What you are feeling matters, and you are not alone. Please contact a mental health crisis line in your country or go to the nearest emergency department. If you are in immediate danger, call emergency services now and stay with someone you trust."
    evidence_source: "بروتوكولات سلامة المرضى في التعبير عن إيذاء النفس"
    notes: "المطابقة اللفظية تكتشف التعبير الصريح فقط؛ التعبير غير المباشر مسؤولية الطبقة الدلالية التي ترفع الخطورة ولا تخفضها."

  - rule_id: "HEALIX_REDFLAG_0010"
    name_ar: "ضيق تنفّس شديد"
    name_en: "Severe respiratory distress"
    risk_level: "immediate"
    trigger_type: "combination"
    all_of: ["dyspnea"]
    any_of: ["cannot_complete_sentence", "cyanosis"]
    recommended_action_ar: "صعوبة التنفس بهذه الشدّة حالة طارئة. اطلب الإسعاف فوراً واجلس في وضع مريح للتنفّس."
    recommended_action_en: "Breathing difficulty of this severity is an emergency. Call emergency services immediately and sit in a position that eases breathing."
    evidence_source: "عجز المريض عن إكمال جملة مؤشر سريري على ضيق تنفّس شديد"
    notes: "ضيق التنفّس وحده شائع؛ عدم إكمال الجملة أو الازرقاق هو ما يرفعه لحالة طارئة."
