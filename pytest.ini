[pytest]
testpaths = tests
markers =
    vocabulary_completeness: asserts vocabulary/symptoms.py's entry count matches EXPECTED_SYMPTOM_COUNT. Deselected by default not because the vocabulary is known-incomplete, but because adding an entry (see CLAUDE.md > Vocabulary provenance and growth) genuinely leaves the two out of sync for a moment mid-addition — a marked test that flickers red during ordinary correct workflow gets ignored same as a permanently red one. Run it with: pytest -m vocabulary_completeness

# See the marker docstring above: this exclusion is about mid-addition churn,
# not a standing known gap. Passing -m on the command line overrides this,
# since CLI args are applied after addopts.
addopts = -m "not vocabulary_completeness"
